name: Build EXE

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Python ──────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install dependencies ──────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── 4. Build EXE with PyInstaller ────────────────────────────
      - name: Build EXE
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "AclassStore-WinCouterV2" `
            --icon "web/LogoV.ico" `
            --add-data "web;web" `
            --add-data "settings.json;." `
            --add-data "settings_v5.json;." `
            --hidden-import "core.hotkeys" `
            --hidden-import "core.state" `
            --hidden-import "ui.styles" `
            --hidden-import "ui.widgets" `
            main.py

      # ── 5. Verify build output ───────────────────────────────────
      - name: Verify EXE exists
        run: |
          if (Test-Path "dist/AclassStore-WinCouterV2.exe") {
            Write-Host "✅ Build succeeded: AclassStore-WinCouterV2.exe"
            Get-Item "dist/AclassStore-WinCouterV2.exe" | Select-Object Name, Length, LastWriteTime
          } else {
            Write-Host "❌ Build failed: EXE not found"
            exit 1
          }
        shell: pwsh

      # ── 6. Upload artifact (every build) ─────────────────────────
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AclassStore-WinCouterV2
          path: dist/AclassStore-WinCouterV2.exe
          retention-days: 30

      # ── 7. Create GitHub Release (only on tag push) ───────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "AclassStore-WinCouterV2 ${{ github.ref_name }}"
          body: |
            ## 🚀 AclassStore-WinCouterV2 ${{ github.ref_name }}

            ### การติดตั้ง
            1. ดาวน์โหลด `AclassStore-WinCouterV2.exe`
            2. รันไฟล์โดยตรง (ไม่ต้องติดตั้ง)

            ### การเปลี่ยนแปลง
            ดูรายละเอียดใน [Commits](${{ github.server_url }}/${{ github.repository }}/commits/${{ github.ref_name }})
          files: dist/AclassStore-WinCouterV2.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
