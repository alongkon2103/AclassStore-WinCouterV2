name: Build and Release EXE

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Python ──────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install dependencies ──────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── 4. Build EXE with PyInstaller ────────────────────────────
      - name: Build EXE
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "AclassStore-WinCouterV2" `
            --icon "web/LogoV.ico" `
            --add-data "web;web" `
            --add-data "settings.json;." `
            --add-data "settings_v5.json;." `
            --hidden-import "PySide6.QtCore" `
            --hidden-import "PySide6.QtGui" `
            --hidden-import "PySide6.QtWidgets" `
            --hidden-import "core.hotkeys" `
            --hidden-import "core.state" `
            --hidden-import "ui.styles" `
            --hidden-import "ui.widgets" `
            main.py

      # ── 5. Verify build output ───────────────────────────────────
      - name: Verify EXE exists
        run: |
          if (Test-Path "dist/AclassStore-WinCouterV2.exe") {
            Write-Host "✅ Build succeeded: AclassStore-WinCouterV2.exe"
            Get-Item "dist/AclassStore-WinCouterV2.exe" | Select-Object Name, Length, LastWriteTime
          } else {
            Write-Host "❌ Build failed: EXE not found"
            exit 1
          }
        shell: pwsh

      # ── 6. Create GitHub Release ──────────────────────────────────
      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build (Auto-generated)' }}
          body: |
            ## 🚀 AclassStore-WinCouterV2
            
            ไฟล์ EXE นี้ถูกสร้างขึ้นโดยอัตโนมัติจากระบบ CI/CD
            
            ### การติดตั้งและใช้งาน
            1. ดาวน์โหลดไฟล์ `AclassStore-WinCouterV2.exe` ด้านล่าง
            2. รันไฟล์เพื่อเริ่มใช้งานได้ทันที
            
            ---
            *สร้างเมื่อ: ${{ github.event.head_commit.timestamp || github.run_id }}*
            *Commit: ${{ github.sha }}*
          files: dist/AclassStore-WinCouterV2.exe
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
