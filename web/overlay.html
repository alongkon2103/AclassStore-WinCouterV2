<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;display:flex;align-items:center;
     justify-content:center;width:100vw;height:100vh;overflow:hidden}
#overlay{display:flex;align-items:center;justify-content:center;
         gap:8px;transition:all 0.3s ease}
#label,#wins-text,#sep,#max-text{transition:all 0.2s}
.pulse{animation:pulse 0.35s cubic-bezier(.36,.07,.19,.97)}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.22)}
  70%{transform:scale(0.94)}100%{transform:scale(1)}}
</style></head><body>
<div id="overlay">
  <span id="label"></span>
  <span id="wins-text"></span>
  <span id="sep"></span>
  <span id="max-text"></span>
</div>
<script>
let prev = -1;

function applyStroke(el, color, size) {
  if (size <= 0) { el.style.textShadow = 'none'; return; }
  const s = size, c = color;
  const sh = [];
  for (let dx = -s; dx <= s; dx++) {
    for (let dy = -s; dy <= s; dy++) {
      if (dx === 0 && dy === 0) continue;
      sh.push(`${dx}px ${dy}px 0 ${c}`);
    }
  }
  el.style.textShadow = sh.join(',');
}

function hexToRgb(hex){
  return `${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)}`
}

async function update() {
  try {
    const s = await fetch('/state').then(r => r.json());
    const overlay  = document.getElementById('overlay');
    const labelEl  = document.getElementById('label');
    const winsEl   = document.getElementById('wins-text');
    const sepEl    = document.getElementById('sep');
    const maxEl    = document.getElementById('max-text');

    const ff = s.font_family, fs = s.font_size+'px', fw = s.font_bold?'bold':'normal';
    const sc = s.stroke_color, ss = s.stroke ? s.stroke_size : 0;

    const opacity = (s.bg_opacity || 0) / 100;
    if (opacity <= 0) {
      overlay.style.background = 'transparent';
    } else if (s.bg_gradient) {
      const dir = s.bg_gradient_dir || 'to right';
      overlay.style.background =
        `linear-gradient(${dir},rgba(${hexToRgb(s.color_bg)},${opacity}),rgba(${hexToRgb(s.color_bg2||'#1a1a2e')},${opacity}))`;
    } else {
      overlay.style.background = `rgba(${hexToRgb(s.color_bg)},${opacity})`;
    }
    overlay.style.borderRadius = (s.bg_border_radius||0)+'px';
    overlay.style.padding = `${s.bg_padding_v||0}px ${s.bg_padding_h||0}px`;
    overlay.style.flexDirection = s.layout==='vertical' ? 'column' : 'row';

    [labelEl,winsEl,sepEl,maxEl].forEach(el=>{
      el.style.fontFamily = ff;
      el.style.fontSize   = fs;
      el.style.fontWeight = fw;
    });

    labelEl.style.display = s.show_label ? '' : 'none';
    labelEl.textContent = s.label_win;
    labelEl.style.color = s.color_label;
    applyStroke(labelEl, sc, ss);

    winsEl.textContent = s.wins;
    winsEl.style.color = (s.wins < 0) ? s.color_negative : s.color_win;
    applyStroke(winsEl, sc, ss);

    sepEl.style.display = s.show_max ? '' : 'none';
    sepEl.textContent = s.separator;
    sepEl.style.color = s.color_label;
    applyStroke(sepEl, sc, ss);

    maxEl.style.display = s.show_max ? '' : 'none';
    maxEl.textContent = s.max_wins;
    maxEl.style.color = s.color_lose;
    applyStroke(maxEl, sc, ss);

    if (s.wins !== prev) {
      winsEl.classList.remove('pulse');
      void winsEl.offsetWidth;
      winsEl.classList.add('pulse');
      prev = s.wins;
    }
  } catch(e) {}
  setTimeout(update, 150);
}
update();
</script></body></html>
